<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دستیار LMS — نسخه وب</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body data-theme="light">

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-icon">🎓</span>
      <div>
        <h1>دستیار LMS</h1>
        <small>دانشگاه اصفهان</small>
      </div>
    </div>

    <nav class="nav">
      <a href="#/" data-page="dashboard" class="nav-item active">📊 داشبورد</a>
      <a href="#/courses" data-page="courses" class="nav-item">📚 درس‌ها</a>
      <a href="#/assignments" data-page="assignments" class="nav-item">📝 تکالیف</a>
      <a href="#/events" data-page="events" class="nav-item">📅 رویدادها</a>
      <a href="#/posts" data-page="posts" class="nav-item">💬 پیام‌های وال</a>
      <a href="#/contents" data-page="contents" class="nav-item">📁 محتواها</a>
      <a href="#/changes" data-page="changes" class="nav-item">🔔 تغییرات</a>
      <a href="#/quera" data-page="quera" class="nav-item">⚙️ کوئرا</a>
      <a href="#/settings" data-page="settings" class="nav-item">⚙️ تنظیمات</a>
    </nav>

    <div class="sidebar-footer">
      <button id="btn-sync" class="btn btn-primary btn-block">🔄 همگام‌سازی</button>
      <div id="sync-progress" class="sync-progress hidden">
        <div class="progress-track"><div id="sync-bar" class="progress-bar"></div></div>
        <small id="sync-label">در حال آماده‌سازی…</small>
      </div>
      <div class="user-box" id="user-box">
        <span id="user-name">کاربر مهمان</span>
        <button id="btn-logout" class="btn btn-ghost btn-sm">خروج</button>
      </div>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <main class="main">
    <header class="topbar">
      <button id="btn-menu" class="btn btn-ghost">☰</button>
      <h2 id="page-title">داشبورد</h2>
      <span class="spacer"></span>
      <button id="btn-theme" class="btn btn-ghost" title="تغییر تم">🌙</button>
    </header>

    <section id="content" class="content">
      <div class="loading">⏳ در حال بارگذاری…</div>
    </section>
  </main>

  <!-- ===== Login Modal ===== -->
  <div id="login-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3>🔐 ورود به حساب کاربری</h3>
      <p class="muted">اطلاعات حساب LMS دانشگاه (و اختیاری کوئرا) را وارد کنید.</p>
      <form id="login-form">
        <label>شماره دانشجویی (LMS)
          <input type="text" id="lms-username" required autocomplete="username" />
        </label>
        <label>رمز عبور (LMS)
          <input type="password" id="lms-password" required autocomplete="current-password" />
        </label>
        <label>نام کاربری کوئرا (اختیاری)
          <input type="text" id="quera-username" autocomplete="username" />
        </label>
        <label>رمز عبور کوئرا (اختیاری)
          <input type="password" id="quera-password" autocomplete="current-password" />
        </label>
        <div id="login-error" class="error hidden"></div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary" id="btn-login-submit">ورود</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Toast ===== -->
  <div id="toast" class="toast hidden"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
