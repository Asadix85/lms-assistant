<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- پس‌زمینه گرد -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A84FF"/>
      <stop offset="100%" style="stop-color:#0062CC"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bgGrad)"/>

  <!-- کتاب باز -->
  <g transform="translate(128, 140)">
    <!-- صفحه چپ -->
    <path d="M -70 -30 Q -35 -45 0 -30 L 0 50 Q -35 35 -70 50 Z"
          fill="white" opacity="0.95"/>
    <!-- صفحه راست -->
    <path d="M 0 -30 Q 35 -45 70 -30 L 70 50 Q 35 35 0 50 Z"
          fill="white" opacity="0.85"/>
    <!-- خط وسط -->
    <line x1="0" y1="-30" x2="0" y2="50" stroke="#0A84FF" stroke-width="2"/>
  </g>

  <!-- کلاه فارغ‌التحصیلی (اختیاری) -->
  <g transform="translate(128, 70)">
    <polygon points="0,-25 45,-5 0,15 -45,-5" fill="#FFD60A"/>
    <rect x="-8" y="-5" width="16" height="30" fill="#FFD60A"/>
    <circle cx="8" cy="20" r="3" fill="#FFD60A"/>
    <line x1="8" y1="20" x2="8" y2="10" stroke="#FFD60A" stroke-width="2"/>
  </g>
</svg>