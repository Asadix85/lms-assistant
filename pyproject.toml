[project]
name = "lms-assistant"
version = "0.1.0"
description = "LMS Assistant for University of Isfahan"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "loguru>=0.7",
    "jdatetime>=5.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "matplotlib>=3.8",
]
bot = [
    "aiogram>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["config", "src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
