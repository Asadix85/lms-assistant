name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint (ruff check)
        run: ruff check src config tests main.py
      - name: Format check (ruff format)
        run: ruff format --check src config main.py
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run unit tests
        run: pytest tests -x -q
        env:
          LMS_USERNAME: test_user
          LMS_PASSWORD: test_pass

  # هشدار اگر داده‌ی حساس در حال commit شدن باشد
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check .env is not committed
        run: |
          if git ls-files | grep -E '^\.env$'; then
            echo "::error::فایل .env در Git commit شده است! آن را از تاریخچه حذف کنید."
            exit 1
          fi
          echo "✅ .env commit نشده است"
