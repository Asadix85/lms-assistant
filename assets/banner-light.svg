    </linearGradient>
    <radialGradient id="a1" cx=".2" cy=".2" r=".5"><stop offset="0" stop-color="#3b82f6" stop-opacity=".28"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
